<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" fill="none">
  <defs>
    <linearGradient id="s3card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0E0E11" />
    </linearGradient>
    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF6" />
      <stop offset="100%" stop-color="#7C6AE6" />
    </linearGradient>
  </defs>
  <rect width="480" height="220" rx="12" fill="url(#s3card)" stroke="rgba(255,255,255,0.08)" />

  <!-- Publishing Progress Circle & Status -->
  <g transform="translate(130, 28)">
    <circle cx="110" cy="50" r="38" stroke="#22222A" stroke-width="4" fill="none" />
    <circle cx="110" cy="50" r="38" stroke="url(#readyGrad)" stroke-width="4" stroke-dasharray="238" stroke-dashoffset="0" stroke-linecap="round" fill="none" />
    <path d="M100 50l7 7 15-16" stroke="#EDEDEF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="110" y="105" fill="#EDEDEF" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">SYNTHESIS COMPLETE · 100% READY</text>
    <text x="110" y="123" fill="#71717A" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Mastered WAV (48kHz) · 1080p MP4 Video Audiogram</text>
  </g>

  <!-- Distribution Channels Bar -->
  <g transform="translate(60, 162)">
    <rect width="360" height="36" rx="8" fill="#141418" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Platform tags -->
    <text x="40" y="23" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● SPOTIFY</text>
    <text x="135" y="23" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● APPLE PODCASTS</text>
    <text x="260" y="23" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● YOUTUBE</text>
    <text x="330" y="23" fill="#8B7CF6" font-family="'Inter', sans-serif" font-size="11" font-weight="700">● RSS</text>
  </g>
</svg>
