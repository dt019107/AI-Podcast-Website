<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <radialGradient id="demoRadial" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090F" />
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="20" fill="url(#demoRadial)" />
  <rect width="960" height="540" rx="20" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Studio Grid & Ambient Glows -->
  <circle cx="480" cy="270" r="180" fill="#6366F1" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="700" cy="200" r="140" fill="#06B6D4" opacity="0.08" filter="url(#glowFilter)" />

  <!-- Top Bar Badges -->
  <g transform="translate(48, 40)">
    <rect width="130" height="30" rx="15" fill="rgba(99,102,241,0.2)" stroke="#6366F1" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#06B6D4" />
    <text x="70" y="20" fill="#E2E8F0" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEMO EPISODE</text>
  </g>

  <g transform="translate(810, 40)">
    <rect width="102" height="30" rx="15" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="51" y="20" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">24:18 MIN</text>
  </g>

  <!-- Central Video Graphic: Dynamic Spectrum Visualizer -->
  <g transform="translate(180, 260)">
    <!-- Spectrum visualizer symmetrical bars -->
    <rect x="0" y="-30" width="6" height="60" rx="3" fill="#6366F1" opacity="0.5" />
    <rect x="16" y="-45" width="6" height="90" rx="3" fill="#6366F1" opacity="0.7" />
    <rect x="32" y="-20" width="6" height="40" rx="3" fill="#6366F1" opacity="0.6" />
    <rect x="48" y="-60" width="6" height="120" rx="3" fill="#06B6D4" opacity="0.8" />
    <rect x="64" y="-80" width="6" height="160" rx="3" fill="#06B6D4" />
    <rect x="80" y="-40" width="6" height="80" rx="3" fill="#6366F1" opacity="0.7" />
    <rect x="96" y="-70" width="6" height="140" rx="3" fill="#A855F7" opacity="0.85" />
    <rect x="112" y="-100" width="6" height="200" rx="3" fill="#A855F7" />
    <rect x="128" y="-55" width="6" height="110" rx="3" fill="#6366F1" opacity="0.75" />
    <rect x="144" y="-35" width="6" height="70" rx="3" fill="#06B6D4" opacity="0.65" />

    <!-- Right side mirrored -->
    <g transform="translate(450, 0)">
      <rect x="0" y="-35" width="6" height="70" rx="3" fill="#06B6D4" opacity="0.65" />
      <rect x="16" y="-55" width="6" height="110" rx="3" fill="#6366F1" opacity="0.75" />
      <rect x="32" y="-100" width="6" height="200" rx="3" fill="#A855F7" />
      <rect x="48" y="-70" width="6" height="140" rx="3" fill="#A855F7" opacity="0.85" />
      <rect x="64" y="-40" width="6" height="80" rx="3" fill="#6366F1" opacity="0.7" />
      <rect x="80" y="-80" width="6" height="160" rx="3" fill="#06B6D4" />
      <rect x="96" y="-60" width="6" height="120" rx="3" fill="#06B6D4" opacity="0.8" />
      <rect x="112" y="-20" width="6" height="40" rx="3" fill="#6366F1" opacity="0.6" />
      <rect x="128" y="-45" width="6" height="90" rx="3" fill="#6366F1" opacity="0.7" />
      <rect x="144" y="-30" width="6" height="60" rx="3" fill="#6366F1" opacity="0.5" />
    </g>
  </g>

  <!-- Big Play Button in Center -->
  <g transform="translate(480, 270)">
    <circle r="52" fill="url(#btnGrad)" filter="url(#glowFilter)" />
    <circle r="46" fill="#182032" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    <polygon points="-8,-18 20,0 -8,18" fill="#06B6D4" />
  </g>

  <!-- Bottom Title and Meta -->
  <g transform="translate(48, 440)">
    <text x="0" y="24" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">Episode 01: How AI Audio is Outperforming Human Voice Studios</text>
    <text x="0" y="52" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Generated completely from a 1,200-word blog post in 3 minutes 42 seconds.</text>
  </g>
</svg>

