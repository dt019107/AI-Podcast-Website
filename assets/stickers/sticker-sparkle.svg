<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-sp" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
    <linearGradient id="sparkle-grad" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sparkle-mini" x1="56" y1="16" x2="84" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-sp)">
    <!-- Main 4-point Sparkle Star -->
    <path d="M44 14 C44 30 32 42 16 44 C32 46 44 58 46 74 C48 58 60 46 76 44 C60 42 48 30 46 14 Z" 
          stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" fill="#FFFFFF" />
    <path d="M44 14 C44 30 32 42 16 44 C32 46 44 58 46 74 C48 58 60 46 76 44 C60 42 48 30 46 14 Z" 
          fill="url(#sparkle-grad)" />
    <!-- Main Star Inner Highlight -->
    <circle cx="46" cy="44" r="6" fill="#FFFBEB" />
    <ellipse cx="43" cy="38" rx="2.5" ry="6" fill="#FFFFFF" fill-opacity="0.8" />
    <ellipse cx="38" cy="43" rx="6" ry="2.5" fill="#FFFFFF" fill-opacity="0.8" />
    
    <!-- Mini Secondary Sparkle -->
    <path d="M72 18 C72 24 67 29 61 30 C67 31 72 36 73 42 C74 36 79 31 85 30 C79 29 74 24 73 18 Z" 
          stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" fill="#FFFFFF" />
    <path d="M72 18 C72 24 67 29 61 30 C67 31 72 36 73 42 C74 36 79 31 85 30 C79 29 74 24 73 18 Z" 
          fill="url(#sparkle-mini)" />
    <circle cx="73" cy="30" r="2" fill="#FFFFFF" />
  </g>
</svg>