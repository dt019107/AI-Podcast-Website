<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
    <linearGradient id="shield-grad" x1="20" y1="14" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-sh)">
    <!-- White Die-Cut Backing -->
    <path d="M48 12 L74 22 C74 48 64 72 48 82 C32 72 22 48 22 22 Z" 
          stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" fill="#FFFFFF" />
