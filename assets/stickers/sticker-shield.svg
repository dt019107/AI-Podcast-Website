    <!-- Specular Sheen Half -->
    <path d="M48 14 L48 78 C35 69 25 47 25 24 L48 14 Z" fill="#FFFFFF" fill-opacity="0.18" />
    <!-- Golden Checkmark -->
    <path d="M37 46 L45 54 L61 36" stroke="#FEF08A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M37 46 L45 54 L61 36" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
