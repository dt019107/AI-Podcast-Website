<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C3AED" flood-opacity="0.3" />
    </filter>
    <linearGradient id="mic-body" x1="20" y1="16" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="mic-mesh" x1="32" y1="16" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="specular" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow)">
    <!-- Thick Outer Die-Cut White Border -->
    <path d="M48 68 C38 68 32 60 32 50 L32 28 C32 18 40 10 50 10 C60 10 68 18 68 28 L68 50 C68 60 60 68 50 68 Z M50 68 L50 78 M38 84 L62 84" 
          stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Microphone Stand Base & Neck -->
    <path d="M50 66 L50 78 M38 82 L62 82" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
    <!-- Stand Cradle -->
    <path d="M30 40 C30 54 40 64 50 64 C60 64 70 54 70 40" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round" />
    <!-- Capsule Body -->
    <rect x="36" y="14" width="28" height="42" rx="14" fill="url(#mic-body)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Top Mesh Grille -->
    <path d="M36 28 C36 20.268 42.268 14 50 14 C57.732 14 64 20.268 64 28 Z" fill="url(#mic-mesh)" />
    <!-- Mesh Texture Lines -->
    <line x1="42" y1="16" x2="42" y2="28" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="50" y1="14" x2="50" y2="28" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />
    <line x1="58" y1="16" x2="58" y2="28" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="38" y1="22" x2="62" y2="22" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Specular Highlight Ellipse -->
    <ellipse cx="43" cy="20" rx="3.5" ry="2" fill="#FFFFFF" fill-opacity="0.85" />
    <path d="M39 20 C39 16 43 15 48 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>