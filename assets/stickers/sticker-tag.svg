<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-tg" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3" />
    </filter>
    <linearGradient id="tag-grad" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-tg)">
    <!-- White Die-Cut Backing -->
    <path d="M22 20 L48 20 L80 52 C84 56 84 62 80 66 L66 80 C62 84 56 84 52 80 L20 48 L20 22 C20 21 21 20 22 20 Z" 
          stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" fill="#FFFFFF" />
    <!-- Tag Body -->
    <path d="M22 20 L48 20 L80 52 C84 56 84 62 80 66 L66 80 C62 84 56 84 52 80 L20 48 L20 22 C20 21 21 20 22 20 Z" 
          fill="url(#tag-grad)" />
    <!-- Eyelet Hole -->
    <circle cx="34" cy="34" r="5" fill="#042F2E" />
    <circle cx="34" cy="34" r="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />
    <!-- Specular Sheen -->
    <path d="M30 24 L46 24 L74 52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Currency / Value Symbol -->
    <text x="56" y="64" font-size="20" font-family="Space Grotesk, sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-45 56 64)">$</text>
  </g>
</svg>