<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-lk" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.3" />
    </filter>
    <linearGradient id="link-grad" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-lk)">
    <!-- White Die-Cut Backing -->
    <rect x="18" y="32" width="38" height="22" rx="11" transform="rotate(-45 37 43)" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" />
    <rect x="40" y="42" width="38" height="22" rx="11" transform="rotate(-45 59 53)" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" />
    <!-- Link Loop 1 -->
    <rect x="18" y="32" width="38" height="22" rx="11" transform="rotate(-45 37 43)" stroke="url(#link-grad)" stroke-width="6" fill="none" />
    <!-- Link Loop 2 -->
    <rect x="40" y="42" width="38" height="22" rx="11" transform="rotate(-45 59 53)" stroke="url(#link-grad)" stroke-width="6" fill="none" />
    <!-- Highlights -->
    <path d="M26 36 C30 30 38 30 44 36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
    <path d="M48 58 C52 52 60 52 66 58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
  </g>
</svg>