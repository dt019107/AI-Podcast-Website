<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-hp" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.3" />
    </filter>
    <linearGradient id="headband" x1="16" y1="16" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="earcup-l" x1="16" y1="44" x2="36" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="earcup-r" x1="60" y1="44" x2="80" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-hp)">
    <!-- Die-Cut Outline -->
    <path d="M22 52 C22 32 32 16 48 16 C64 16 74 32 74 52" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none"/>
    <rect x="14" y="44" width="18" height="28" rx="9" fill="#FFFFFF" />
    <rect x="64" y="44" width="18" height="28" rx="9" fill="#FFFFFF" />
    <!-- Headband Arc -->
    <path d="M24 50 C24 34 34 22 48 22 C62 22 72 34 72 50" stroke="url(#headband)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M34 22 C40 19 56 19 62 22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" fill="none"/>
    <!-- Left Ear Cup -->
    <rect x="16" y="46" width="14" height="24" rx="7" fill="url(#earcup-l)" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="20" cy="52" rx="2" ry="4" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="26" y="49" width="4" height="18" rx="2" fill="#04242B" fill-opacity="0.4" />
    <!-- Right Ear Cup -->
    <rect x="66" y="46" width="14" height="24" rx="7" fill="url(#earcup-r)" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="70" cy="52" rx="2" ry="4" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="66" y="49" width="4" height="18" rx="2" fill="#04242B" fill-opacity="0.4" />
  </g>
</svg>