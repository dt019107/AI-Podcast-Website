<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <filter id="sticker-shadow-rk" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EC4899" flood-opacity="0.3" />
    </filter>
    <linearGradient id="rocket-body" x1="40" y1="12" x2="74" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="flame" x1="24" y1="64" x2="38" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>
  <g filter="url(#sticker-shadow-rk)">
    <!-- White Die-Cut Backing -->
    <path d="M68 14 C74 20 80 44 64 64 L54 62 L42 74 L38 68 L28 68 L36 56 L34 46 C54 30 78 36 68 14 Z" 
          stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="#FFFFFF" />
    <!-- Thruster Flame -->
    <path d="M34 62 C26 68 20 84 28 84 C36 84 42 76 42 70 Z" fill="url(#flame)" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="32" cy="74" r="3" fill="#FEF08A" />
    <!-- Left Fin -->
    <path d="M36 54 L26 66 L38 64 Z" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
    <!-- Right Fin -->
    <path d="M56 34 L68 46 L64 36 Z" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
    <!-- Rocket Fuselage -->
    <path d="M72 16 C60 18 42 34 38 56 L54 58 C68 44 76 28 72 16 Z" fill="url(#rocket-body)" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Porthole Window -->
    <circle cx="56" cy="34" r="7" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="54" cy="32" r="2.5" fill="#BAE6FD" />
    <!-- Sheen Streak -->
    <path d="M66 22 C60 26 52 36 50 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
  </g>
</svg>